[env:lcdwiki_3_5_e22]
custom_meshtastic_hw_model = 255  # Custom variant ID (adjust if needed)
custom_meshtastic_hw_model_slug = LCDWIKI_3_5_E22
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1  # Community supported
custom_meshtastic_display_name = LCDWIKI 3.5in E22
custom_meshtastic_tags = LCDWIKI,Display,E22,LoRa,ESP32

extends = esp32_base
board_level = release
board = esp32dev
monitor_filters = esp32_exception_decoder

# Pin tool-esptoolpy explicitly. This machine has 8 espressif32 platform versions
# installed and they disagree about this package: the meshtastic fork wants pioarduino
# 5.3.0 (via URL), while @7.0.1 / @src-5f1172 want platformio ~2.41100.0 (esptool 4.11.0)
# and @6.5/@6.9/@6.10 want ~1.40501.0 (4.5.1). Registry packages install to the
# UNVERSIONED packages/tool-esptoolpy directory, so whichever platform resolves last
# clobbers it - the active esptool silently flip-flopped 5.3.0 -> 4.11.0 -> 4.5.1 between
# builds. esptool 4.x only accepts underscore args (--flash_mode) while this platform's
# builder emits 5.x dashed ones (--flash-mode), and the mismatch does not surface until
# "Building bootloader.bin" at the very END of a full build (cached builds skip that step
# entirely), so it costs a full ~27min compile to discover.
# Pinning the upstream https URL does NOT work: that zip is a 990-byte stub whose
# tools.json points at the real source, and PlatformIO's two-stage install REWRITES the
# recorded spec.uri to its local staging path
# ("file://<home>/.platformio/tools/tool-esptoolpy"). The recorded spec then never matches
# an https requirement, so get_package_dir() returns None and esp32_extra.py dies with
# "TypeError: expected str, bytes or os.PathLike object, not NoneType".
# Vendoring the real esptool 5.3.0 tree in-tree and pointing at it with symlink:// avoids
# both problems: nothing is downloaded, nothing is staged, the recorded URI matches the
# requirement, and the registry package cannot clobber it. The tree is the official
# pioarduino v5.3.0 release (sha256 23d4c80f...a18, verified against tools.json).
# tool-scons is vendored for the same reason esptool is, but a different failure: two
# packages claim that one directory. The platform asks for pioarduino's scons-4.8.1.zip,
# which is a 3-file stub whose real payload is fetched by a SECOND stage during a build -
# and that can never run, because PlatformIO needs scons in order to run a build at all.
# PlatformIO core separately wants platformio/tool-scons@~4.41101.0, which installs fine
# on its own (222 files). During `pio run` both install over each other and the directory
# ends up EMPTY, so the build dies with "No module named 'SCons.Tool.FortranCommon'".
# Pointing at an in-tree copy takes the directory out of the package manager's hands.

# Do NOT pin framework-arduinoespressif32 by https URL here. It fails the same way
# tool-esptoolpy does above: PlatformIO rewrites the recorded spec on install, the spec
# then never matches an https requirement, get_package_dir() returns None, and arduino.py
# dies with "TypeError: ... not 'NoneType'" before a single file compiles. The platform's
# own platform.json already pins the right release.
platform_packages =
  ${esp32_common.platform_packages}
  tool-esptoolpy@symlink://tools/esptool-5.3.0
  tool-scons@symlink://tools/scons-4.41101.0

build_src_filter =
  ${esp32_base.build_src_filter}
  # esp32_base strips -<mesh/http/> for plain ESP32 (see variants/esp32/esp32.ini:10) and
  # drops esp32_https_server with it. Put both back: the web UI still exists in the tree,
  # it serves /static off the filesystem, and this board has Wi-Fi.
  +<mesh/http/>


# All hardware pin/peripheral configuration lives in variant.h - it is the single
# home for those defines. Only build-level flags belong here.
# esp32_base disables the web UI twice over: it strips -<mesh/http/> from the source
# filter AND passes -DMESHTASTIC_EXCLUDE_WEBSERVER=1 (variants/esp32/esp32.ini:10 and :21).
# Re-adding the sources alone just compiles them to empty translation units, so the flag
# has to be unset here as well.
build_unflags =
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1

build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32/lcdwiki_3_5_e22
  -DLCDWIKI_3_5_E22

  # Web UI over plain HTTP only. The HTTPS half costs mbedtls' static tables, the TLS code,
  # and an on-device RSA-2048 keygen at first boot - none of which this board can spare.
  # Serve it on a trusted LAN; the HTTP API and the UI itself are unchanged.
  -DMESHTASTIC_WEBSERVER_HTTP_ONLY=1

  # Serve the built-in lite console out of flash instead of the official bundle off a
  # filesystem. ~7 KB of .flash.rodata against an 860 KB LittleFS image, it needs no spiffs
  # partition and no SD card, and - being served BY the node - it has no connection to
  # configure. Regenerate WebUIAssets.h with tools/gen_lite_assets.py after editing the page.
  -DMESHTASTIC_WEBUI_LITE=1

  # Draw the map band straight to the panel in 16-bit colour instead of through BaseUI's
  # 1-bit framebuffer. The panel is colour; the framebuffer is not, and its colour regions
  # are rectangles, which cannot express a road hierarchy that crosses itself. A per-pixel
  # colour buffer for the band would be 15 KB at four colours - this costs nothing. See
  # graphics::tftDirectAvailable() for the two rules that keep it safe.
  -DMESHTASTIC_MAP_DIRECT_COLOR=1

  # Ebyte E22-900M30S: 10 dB external PA, 30 dBm rated. Pulls TX_GAIN_LORA 7 and
  # SX126X_MAX_POWER 22 from configuration.h, so RadioInterface subtracts the PA gain
  # before driving the chip (RadioInterface.cpp:1446). Without this the SX1262 is driven
  # at a full 22 dBm and the PA adds ~10 dB on top, radiating ~32 dBm while the node
  # reports 22 - over the rated output and over the US limit.
  -DEBYTE_E22_900M30S

  # Plan-view map frame: heard nodes plotted around our own position, north-up.
  # Monochrome by construction - BaseUI draws into OLEDDisplay's 1-bit buffer, so
  # node state shows as fill and shape. Needs a touchscreen for the on-screen D-pad;
  # swipes are left alone so the frame carousel still works.
  -DBASEUI_HAS_MAP=1

  # Feature exclusions to fit the 4MB flash budget.
  # NOTE: AUDIO, PAXCOUNTER, POWERMON, DROPZONE and REPLYBOT are already excluded
  # by esp32_base / the root [env], so they are deliberately not repeated here.
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  # Do NOT exclude ADMIN. AdminModule is the only handler for ADMIN_APP packets,
  # which is how the phone app (and the CLI) write EVERY config change - including
  # purely local ones over BLE. With it excluded the node silently drops those
  # packets: no error, no log, the app just shows the old value again. Costs only
  # tens of KB and this build sits well under flash.
  # Telemetry is not one flag - these are the real per-subsystem switches.
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  # TELEMETRYDB is deliberately NOT excluded. It is not a history buffer - it is a
  # std::map<NodeNum, meshtastic_DeviceMetrics> (NodeDB.cpp), and DeviceMetrics is four
  # bools, two uint32s and three floats. At MAX_NUM_NODES 60 that is ~3.6 KB worst case,
  # and only for nodes that actually report. It already persists to flash inside
  # /prefs/nodes.proto, so excluding it dropped the in-RAM copy, not the storage - the
  # cost of serving it from flash instead would be a read per lookup on the draw path.
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1

  # The phone's config handshake makes the node walk / three levels deep collecting up to
  # 64 entries (PhoneAPI.cpp:325 -> getFiles -> collectFiles), allocating a
  # shared_ptr<VFSFileImpl> per entry. With little free heap that runs out mid-walk and
  # aborts in lock_init_generic - an OOM panic surfacing in the UART mutex, so the
  # backtrace points at console_write rather than the filesystem. Net effect: the node
  # reboots every time a phone connects. Excluding it sends an empty manifest instead; the
  # only loss is browsing the node's files from a companion app. Upstream uses this flag
  # for the same reason on platforms that cannot safely traverse (nRF54L15).
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1

  # Drop the OLED library's 19.2 KB back buffer (a second copy of the 320x480 1-bit canvas).
  # TFTDisplay.cpp then tracks changes with one hash per 32x8 tile instead (2.4 KB), still
  # pushing only changed spans. This is the ~19 KB the 3.5" otherwise runs short of the 2.8".
  -DOLEDDISPLAY_REDUCE_MEMORY

  # Traffic Management's per-node cache: 10 B/entry, classic-ESP32 default 400 (4 KB).
  # 200 still covers 4x MAX_NUM_NODES; past that the stalest entries are evicted first.
  -DTRAFFIC_MANAGEMENT_CACHE_SIZE=200

board_upload.maximum_size = 3088384
board_upload.flash_size = 4MB
board_upload.flash_freq = 40m
board_upload.flash_mode = dio

# The 320x480 panel's double-buffered 1-bit framebuffer costs ~19 KB more than the 2.8",
# leaving ~70 KB free when NimBLE starts. BLEDevice::init() then spins forever in
# `while (!m_synced)` with no timeout - the host never syncs, the UI freezes on the first
# screen, no reboot. Meshtastic only ever holds one phone link, so the host and controller
# each give up the two extra connection slots they reserve by default (3 -> 1).
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  CONFIG_PARTITION_TABLE_CUSTOM=y
  CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="variants/esp32/lcdwiki_3_5_e22/partitions.csv"
  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  CONFIG_BTDM_CTRL_BLE_MAX_CONN=1

lib_deps =
  ${esp32_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.26
  # Needed by mesh/http, which esp32_base omits for this chip. Same pin esp32_common uses.
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip

lib_ignore =
  m5stack-core
  M5Core2
  M5CoreInk
  M5StickC
  M5Paper
  esp32-camera
  DFRobot_RainfallSensor
  SparkFun_AS3935_Lightning_Detector
  INA226
  SparkFun_MAX3010x
  SparkFun_ICM-20948
  ICM42670P
  Adafruit_LTR390
  Adafruit_PCT2075
  DFRobot_BMM150
  SparkFun_MMC5983MA
  Adafruit_TSL2561
  BH1750_WE
  DFRobot_LarkWeatherStation
  Adafruit_ADS1X15
  Adafruit_DS248x
  Adafruit_BME680
  ClosedCube_OPT3001
