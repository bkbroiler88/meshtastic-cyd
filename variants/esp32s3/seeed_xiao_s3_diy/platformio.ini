[env:seeed-xiao-s3-diy]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-S3 (DIY OLED)
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -D PRIVATE_HW
  -I variants/esp32s3/seeed_xiao_s3_diy
  -DBOARD_HAS_PSRAM
  ; On-device spectrum analyzer (LoRa Actions > Spectrum) and Radio Tuning; the Wio-SX1262 is a bare SX1262, 22 dBm max
  -DSPECTRUM_ANALYZER
  -DRADIO_TUNING_MENU
  -DSPECTRUM_TEST_MAX_DBM=22 
